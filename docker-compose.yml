services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cleanops:cleanops@db:5432/cleanops?schema=public
      SESSION_SECRET: change-me-in-production
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cleanops
      POSTGRES_PASSWORD: cleanops
      POSTGRES_DB: cleanops
    volumes:
      - cleanops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleanops -d cleanops"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cleanops_pg:
