<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="CleanOps Pro — B2B commercial cleaning operations platform.">
<title>CleanOps Pro</title>
<style>
:root{--bg:#f5f7f8;--panel:#fff;--ink:#14232b;--muted:#6e7c83;--line:#e4eaed;--accent:#0d6b61;--accent-soft:#e8f5f2;--warn:#b7791f;--danger:#b53b3b;--shadow:0 12px 30px rgba(20,35,45,.07)}
*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#102a2b;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}.brand{font-size:21px;font-weight:800;margin:4px 10px 28px}.brand small{display:block;font-size:10px;letter-spacing:1.4px;opacity:.6;margin-top:4px}.nav button{width:100%;border:0;background:transparent;color:#cbd8d8;text-align:left;padding:12px;border-radius:9px;margin:2px 0}.nav button.active,.nav button:hover{background:#1b4645;color:#fff}
.main{padding:25px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:25px}.role{background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:9px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.metric .label{color:var(--muted);font-size:12px}.metric .num{font-size:28px;font-weight:800;margin-top:6px}.section{margin-top:20px}.section h2{font-size:17px;margin:0 0 12px}.two{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.6px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700}.badge.warn{background:#fff5df;color:var(--warn)}.badge.danger{background:#fdeaea;color:var(--danger)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.field.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;padding:22px;max-width:620px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modalbox h2{margin-top:0}.close{float:right;border:0;background:none;font-size:22px}.progress{height:8px;background:#e8edef;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}.timeline{border-left:2px solid #dbe7e5;padding-left:16px}.event{margin-bottom:16px}.event strong{display:block}.event span{color:var(--muted);font-size:12px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:relative}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
@media(max-width:560px){.main{padding:18px}.grid,.form{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">CleanOps Pro<small>B2B FACILITY SERVICES</small></div><div class="nav" id="nav"></div></aside>
<main class="main"><div class="top"><div><h1 id="title">Operations Control Center</h1><div id="subtitle" style="color:var(--muted);margin-top:4px">Manage contracts, facilities, workforce and service quality.</div></div><div class="role">MVP • Admin</div></div><div id="view"></div></main>
</div>
<div class="modal" id="modal"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script>
const state={requests:[{id:'REQ-1048',client:'Greenfield School',service:'Deep Cleaning',date:'30 Aug',status:'New'},{id:'REQ-1047',client:'Apex Multispeciality Hospital',service:'Recurring Sanitation',date:'31 Aug',status:'Quoted'},{id:'REQ-1046',client:'Northstar Business Park',service:'Carpet & Floor Care',date:'2 Sep',status:'Scheduled'}],workers:[{name:'Anita Sharma',level:'L2 Certified',skill:'Commercial',status:'Available',rating:'4.9',jobs:184},{name:'Rahul Verma',level:'L3 Specialized',skill:'Hospital',status:'On Site',rating:'4.8',jobs:239},{name:'Meena Kumari',level:'L2 Certified',skill:'Deep Cleaning',status:'Available',rating:'4.9',jobs:161},{name:'Arjun Singh',level:'L4 Senior',skill:'Supervisor',status:'On Site',rating:'4.7',jobs:312}]};
const navItems=[['dashboard','Dashboard'],['requests','Service Requests'],['contracts','Contracts'],['workforce','Workforce'],['sites','Sites & SOPs'],['quality','Quality Control'],['billing','Billing']];
function init(){document.getElementById('nav').innerHTML=navItems.map(([id,label])=>`<button id="n-${id}" onclick="render('${id}')">${label}</button>`).join('');render('dashboard')}
function metric(label,num,note=''){return `<div class="card metric"><div class="label">${label}</div><div class="num">${num}</div><div style="color:var(--muted);font-size:11px;margin-top:4px">${note}</div></div>`}
function render(page){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+page)?.classList.add('active');const titles={dashboard:['Operations Control Center','Manage contracts, facilities, workforce and service quality.'],requests:['Service Requests','Turn incoming facility requirements into quotes and scheduled jobs.'],contracts:['Contracts','Recurring B2B service agreements and profitability.'],workforce:['Professional Workforce','Verified cleaners, specialists and supervisors.'],sites:['Sites & SOPs','Facility-specific cleaning standards and checklists.'],quality:['Quality Control','Inspections, evidence and SLA performance.'],billing:['Billing','Invoices, payments and contract economics.']};document.getElementById('title').textContent=titles[page][0];document.getElementById('subtitle').textContent=titles[page][1];const v=document.getElementById('view');v.innerHTML=({dashboard,requests,contracts,workforce,sites,quality,billing}[page])()}
function dashboard(){return `<div class="grid">${metric('Active Contracts','48','+6 this quarter')}${metric('Active Sites','73','Across 9 facility types')}${metric('Professionals','286','94% verified')}${metric('Revenue / Month','₹38.4L','Gross margin 24.7%')}</div><div class="section two"><div class="card"><h2>Today's Operations</h2><table class="table"><tr><th>Site</th><th>Team</th><th>Progress</th><th>Status</th></tr><tr><td>Apex Hospital</td><td>Team 07</td><td><div class="progress"><i style="width:91%"></i></div></td><td><span class="badge">On Track</span></td></tr><tr><td>St. Mary's School</td><td>Team 12</td><td><div class="progress"><i style="width:74%"></i></div></td><td><span class="badge">On Track</span></td></tr><tr><td>Northstar Park</td><td>Team 03</td><td><div class="progress"><i style="width:58%"></i></div></td><td><span class="badge warn">Attention</span></td></tr></table></div><div class="card"><h2>Alerts</h2><div class="timeline"><div class="event"><strong>Hospital A — checklist exception</strong><span>12 min ago</span></div><div class="event"><strong>School B — worker absent</strong><span>38 min ago</span></div><div class="event"><strong>Office C — complaint open</strong><span>1 hr ago</span></div></div></div></div><div class="section card"><h2>Quick Actions</h2><div class="actions"><button class="btn primary" onclick="openRequest()">Create Service Request</button><button class="btn" onclick="render('workforce')">Assign Professional</button><button class="btn" onclick="render('quality')">Run Inspection</button><button class="btn" onclick="render('billing')">Create Invoice</button></div></div>`}
function requests(){return `<div class="section card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Incoming & Scheduled Requests</h2><button class="btn primary" onclick="openRequest()">+ New Request</button></div><table class="table"><tr><th>ID</th><th>Client</th><th>Service</th><th>Date</th><th>Status</th><th></th></tr>${state.requests.map(r=>`<tr><td>${r.id}</td><td>${r.client}</td><td>${r.service}</td><td>${r.date}</td><td><span class="badge ${r.status==='New'?'warn':''}">${r.status}</span></td><td><button class="btn" onclick="quote('${r.id}')">${r.status==='New'?'Prepare Quote':'View'}</button></td></tr>`).join('')}</table></div>`}
function contracts(){return `<div class="grid">${metric('Contracted MRR','₹38.4L','48 active agreements')}${metric('Avg. Gross Margin','24.7%','Target > 22%')}${metric('Renewals / 60d','7','₹5.8L MRR at stake')}${metric('SLA Compliance','96.2%','Last 30 days')}</div><div class="section card"><h2>Key Accounts</h2><table class="table"><tr><th>Client</th><th>Facility</th><th>Monthly Value</th><th>Status</th><th>Margin</th></tr><tr><td>St. Mary's International School</td><td>School · South Campus</td><td>₹1.20L/mo</td><td><span class="badge">Active</span></td><td>26%</td></tr><tr><td>Apex Multispeciality Hospital</td><td>Hospital · Main Facility</td><td>₹3.80L/mo</td><td><span class="badge">Active</span></td><td>24%</td></tr><tr><td>Northstar Business Park</td><td>Office · Tower A–C</td><td>₹2.10L/mo</td><td><span class="badge">Active</span></td><td>25%</td></tr></table></div>`}
function workforce(){return `<div class="grid">${metric('Total Professionals','286','Active')}${metric('Verified','268','93.7%')}${metric('Available Now','112','Ready for assignment')}${metric('Avg. Rating','4.86','Across 9,842 jobs')}</div><div class="section card"><div style="display:flex;justify-content:space-between"><h2>Professional Directory</h2><button class="btn primary" onclick="openWorker()">+ Add Professional</button></div><table class="table"><tr><th>Professional</th><th>Classification</th><th>Specialization</th><th>Status</th><th>Rating</th><th>Jobs</th></tr>${state.workers.map(w=>`<tr><td><strong>${w.name}</strong></td><td><span class="badge">${w.level}</span></td><td>${w.skill}</td><td>${w.status}</td><td>★ ${w.rating}</td><td>${w.jobs}</td></tr>`).join('')}</table></div>`}
function sites(){return `<div class="section card"><h2>Facility SOP Library</h2><table class="table"><tr><th>Facility Type</th><th>Core SOP</th><th>Checklist Items</th><th>Risk Level</th></tr><tr><td>Hospital</td><td>Clinical sanitation</td><td>32</td><td><span class="badge danger">High</span></td></tr><tr><td>School</td><td>Classroom & washroom</td><td>24</td><td><span class="badge warn">Medium</span></td></tr><tr><td>Office</td><td>Workplace hygiene</td><td>21</td><td><span class="badge">Standard</span></td></tr><tr><td>Industrial</td><td>Factory & warehouse</td><td>29</td><td><span class="badge danger">High</span></td></tr></table></div><div class="section card"><h2>Facility Assessment</h2><p style="color:var(--muted)">Capture floor area, rooms, operating hours, photos and risk zones. The production AI layer will later recommend staffing, frequency, equipment and quote range.</p><button class="btn primary" onclick="openAssessment()">Start Assessment</button></div>`}
function quality(){return `<div class="grid">${metric('Inspections Today','31','28 passed first time')}${metric('SLA Compliance','96.2%','↑ 2.1%')}${metric('Open Complaints','7','3 high priority')}${metric('Evidence Coverage','98.4%','Before/after + checklist')}</div><div class="section card"><h2>Quality Exceptions</h2><table class="table"><tr><th>Site</th><th>Issue</th><th>Severity</th><th>Owner</th><th>Action</th></tr><tr><td>Northstar Park</td><td>Floor-care evidence missing</td><td><span class="badge warn">Medium</span></td><td>Team 03</td><td><button class="btn" onclick="alert('Inspection opened.')">Review</button></td></tr><tr><td>Apex Hospital</td><td>High-touch checklist incomplete</td><td><span class="badge danger">High</span></td><td>Team 07</td><td><button class="btn" onclick="alert('Issue escalated to operations.')">Escalate</button></td></tr></table></div>`}
function billing(){return `<div class="grid">${metric('Outstanding','₹6.7L','18 invoices')}${metric('Collected MTD','₹31.8L','94.5% collection')}${metric('Overdue','₹1.2L','5 accounts')}${metric('Avg. Days to Pay','21','Target < 25')}</div><div class="section card"><h2>Recent Invoices</h2><table class="table"><tr><th>Invoice</th><th>Client</th><th>Amount</th><th>Due</th><th>Status</th></tr><tr><td>INV-2048</td><td>Apex Hospital</td><td>₹3.80L</td><td>10 Sep</td><td><span class="badge">Sent</span></td></tr><tr><td>INV-2047</td><td>St. Mary's School</td><td>₹1.20L</td><td>5 Sep</td><td><span class="badge">Paid</span></td></tr></table></div>`}
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function openRequest(){openModal(`<h2>Create Service Request</h2><div class="form"><div class="field"><label>Organization</label><input id="rclient" placeholder="e.g. Greenfield School"></div><div class="field"><label>Facility Type</label><select id="rtype"><option>School</option><option>Hospital</option><option>Office</option><option>Hotel</option><option>Factory</option><option>Warehouse</option><option>Retail</option></select></div><div class="field"><label>Service</label><select id="rservice"><option>Recurring Cleaning</option><option>Deep Cleaning</option><option>Hospital Sanitation</option><option>Carpet & Floor Care</option><option>Post-Construction Cleaning</option></select></div><div class="field"><label>Preferred Date</label><input id="rdate" type="date"></div><div class="field full"><label>Requirements / Notes</label><textarea id="rnotes" rows="4" placeholder="Area, shifts, rooms, special requirements..."></textarea></div></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="saveRequest()">Create & Route to Operations</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
function saveRequest(){const c=document.getElementById('rclient').value||'New B2B Client';state.requests.unshift({id:'REQ-'+(1050+state.requests.length),client:c,service:document.getElementById('rservice').value,date:document.getElementById('rdate').value||'TBD',status:'New'});closeModal();render('requests')}
function quote(id){openModal(`<h2>Quote ${id}</h2><p style="color:var(--muted)">Operations review: staffing, consumables, equipment, frequency and SLA.</p><div class="form"><div class="field"><label>Estimated Monthly Value</label><input value="₹1,50,000"></div><div class="field"><label>Estimated Gross Margin</label><input value="24%"></div><div class="field"><label>Team Size</label><input value="6"></div><div class="field"><label>Frequency</label><select><option>Daily</option><option>6 days/week</option><option>3 days/week</option><option>Weekly</option></select></div></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="alert('Quote prepared and ready for client approval.');closeModal()">Prepare Quote</button></div>`)}
function openWorker(){openModal(`<h2>Add Professional</h2><div class="form"><div class="field"><label>Full Name</label><input placeholder="Professional name"></div><div class="field"><label>Primary Skill</label><select><option>Commercial Cleaning</option><option>Hospital Sanitation</option><option>Deep Cleaning</option><option>Floor Care</option><option>Supervisor</option></select></div><div class="field"><label>Classification</label><select><option>L1 General</option><option>L2 Certified</option><option>L3 Specialized</option><option>L4 Senior</option></select></div><div class="field"><label>Verification</label><select><option>Pending</option><option>Identity Verified</option><option>Background Checked</option></select></div></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="alert('Professional profile created in onboarding queue.');closeModal()">Create Profile</button></div>`)}
function openAssessment(){openModal(`<h2>Facility Assessment</h2><div class="form"><div class="field"><label>Facility Area (sq ft)</label><input type="number" placeholder="25000"></div><div class="field"><label>Operating Hours</label><input placeholder="07:00–19:00"></div><div class="field"><label>Rooms / Zones</label><input placeholder="Classrooms, washrooms, labs..."></div><div class="field"><label>Cleaning Frequency</label><select><option>Daily</option><option>6 days/week</option><option>3 days/week</option><option>Weekly</option></select></div><div class="field full"><label>Special Risk / Compliance Requirements</label><textarea rows="3"></textarea></div></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="alert('Assessment saved. AI recommendation engine is planned for Phase 2.');closeModal()">Save Assessment</button></div>`)}
init();
</script>
</body></html>
