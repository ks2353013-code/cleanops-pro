name: Production Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cleanops
          POSTGRES_PASSWORD: cleanops_ci
          POSTGRES_DB: cleanops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleanops -d cleanops_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cleanops:cleanops_ci@localhost:5432/cleanops_ci?schema=public
      BASE_URL: ${{ secrets.STAGING_BASE_URL || 'https://cleanops-pro-staging.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm test
      - run: npm run build
      - name: Start application
        run: npm start > /tmp/cleanops.log 2>&1 &
      - name: Wait for application
        run: npx --yes wait-on http://localhost:3000/api/health
      - name: Local health smoke test
        run: BASE_URL=http://localhost:3000 npm run smoke
      - name: Staging health smoke test
        if: ${{ env.BASE_URL != '' }}
        run: npm run smoke
